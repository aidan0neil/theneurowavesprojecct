[build]
  publish = "public"
  command = "echo 'No build command needed for static site'"

[build.environment]
  NODE_VERSION = "18"

# API redirects to serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Pretty URLs for pages
[[redirects]]
  from = "/marathon"
  to = "/marathon.html"
  status = 301

[[redirects]]
  from = "/half-marathon"
  to = "/half-marathon.html"
  status = 301

[[redirects]]
  from = "/5k"
  to = "/5k.html"
  status = 301

[[redirects]]
  from = "/waiver-download"
  to = "/waiver-download.html"
  status = 301

[[redirects]]
  from = "/release-form.pdf"
  to = "/release-form.pdf"
  status = 200

[[redirects]]
  from = "/waiver-download.html"
  to = "/waiver-download.html"
  status = 200


[[redirects]]
  from = "/release-forms/*"
  to = "/release-forms/:splat"
  status = 200

# Handle static assets (CSS, JS, images) - BEFORE catch-all
[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

# Handle 404s by serving index.html (for SPA-like behavior)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[functions]
  directory = "netlify/functions"
